[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-social-backend"
version = "0.1.0"
description = "API foundation for AI Social Automation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.32.0",
  "celery[redis]==5.7.0",
  "cryptography==46.0.3",
  "email-validator==2.3.0",
  "fastapi==0.158.1",
  "httpx==0.28.1",
  "pwdlib[argon2]==0.3.0",
  "pydantic-settings==2.12.0",
  "playwright==1.64.1",
  "psycopg[binary]==3.3.2",
  "SQLAlchemy[asyncio]==2.1.6",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "anyio[trio]==4.9.0",
  "mypy==1.19.0",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-timeout==2.4.0",
  "ruff==0.14.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["alembic"]
